version: '3.8'

services:
  # 1. PostGIS Database Container (Spatial GIS Storage)
  db:
    image: postgis/postgis:15-3.3
    container_name: orebit-postgis
    environment:
      - POSTGRES_DB=orebit_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orebit_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. FastAPI Core Backend Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orebit-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/orebit_db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 3. Production React Frontend Nginx Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orebit-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
